spring.application.name=qhatu-api
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===== JPA: Flyway crea las tablas, Hibernate no las toca =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===== Actuator: solo health =====
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# ===== Subida de archivos (carga masiva de Excel) =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

server.port=8080

# ===== Propias de Qhatu =====
app.cors.origen=${APP_CORS_ORIGEN:http://localhost:3000}
# simulado = FacturadorSimulado | sunat = SUNAT beta (entrega 2)
app.facturador.tipo=${APP_FACTURADOR_TIPO:simulado}
# Clave para firmar los tokens JWT. En prod llega por variable de entorno
app.jwt.secreto=${APP_JWT_SECRETO:qhatu-dev-clave-jwt-solo-para-pruebas-locales-0123456789}
app.jwt.horas=${APP_JWT_HORAS:10}
# Clave para comprobar las licencias. La misma con la que se generan
app.licencia.secreto=${APP_LICENCIA_SECRETO:qhatu-licencia-dev}
# Contraseña del usuario admin que se crea la primera vez
app.admin.password-inicial=${APP_ADMIN_PASSWORD:Admin123*}