# ===== Base de datos en Azure (todo por variables de entorno, sin valores por defecto) =====
spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/${DB_NAME}?sslMode=REQUIRED&serverTimezone=America/Lima
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# En prod las claves son obligatorias: si faltan, la app no arranca
app.jwt.secreto=${APP_JWT_SECRETO}
app.licencia.secreto=${APP_LICENCIA_SECRETO}
app.admin.password-inicial=${APP_ADMIN_PASSWORD}
app.datos-demo=false

spring.jpa.show-sql=false
logging.level.root=INFO