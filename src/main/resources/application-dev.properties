# ===== Base de datos local =====
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:qhatu_db}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.show-sql=false

# En dev se crean también un vendedor y un usuario de logística para probar los roles
app.datos-demo=true